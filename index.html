<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工作维度目标管理系统</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2937}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#172033;color:#fff;padding:22px 14px;position:fixed;left:0;top:0;bottom:0}.brand{font-size:19px;font-weight:700;padding:8px 12px 25px}.brand small{display:block;font-size:12px;font-weight:400;color:#9ca8ba;margin-top:6px}.nav-item{padding:13px 14px;border-radius:7px;margin:5px 0;color:#cbd5e1;cursor:pointer;font-size:14px}.nav-item.active,.nav-item:hover{background:#2b3a52;color:#fff}.main{margin-left:245px;flex:1;padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:24px;font-weight:700}.sub{color:#7b8798;font-size:13px;margin-top:5px}.btn{border:0;background:#263b5c;color:#fff;border-radius:6px;padding:9px 15px;cursor:pointer}.btn.light{background:#fff;color:#344054;border:1px solid #d8dee8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e9ef;border-radius:9px;padding:20px}.stat{font-size:27px;font-weight:700;margin-top:8px}.muted{font-size:13px;color:#8792a2}.section{margin-top:20px}.section-title{font-weight:700;margin-bottom:12px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e9ef;border-radius:9px;overflow:hidden}.table th,.table td{padding:13px 15px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}.table th{background:#fafbfc;color:#667085}.tag{display:inline-block;padding:4px 8px;border-radius:4px;background:#eef3fa;color:#385477;font-size:12px}.upload{border:1px dashed #b8c2d1;padding:24px;text-align:center;border-radius:8px;background:#fafbfd;color:#667085;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e4e8ee;border:1px solid #e4e8ee}.day{background:#fff;min-height:105px;padding:9px;font-size:12px}.day b{display:block;margin-bottom:7px}.todo{background:#eef3fa;padding:5px 6px;border-radius:4px;margin:4px 0;font-size:11px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.board .card{min-height:190px}.board h3{font-size:16px;margin:0 0 14px}.project{padding:10px 0;border-top:1px solid #edf0f4;font-size:13px}.empty{padding:45px;text-align:center;color:#8a94a6;background:#fff;border:1px dashed #d5dbe5;border-radius:8px}.hide{display:none}.history{color:#667085;font-size:12px}.progress{height:7px;background:#edf0f4;border-radius:5px;margin-top:10px}.progress i{display:block;height:100%;width:68%;background:#536f96;border-radius:5px}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand">工作维度目标管理系统<small>部门负责人工作全流程管理</small></div>
<div class="nav-item active" data-page="goals">部门目标管理与月度拆解</div><div class="nav-item" data-page="month">月度目标跟进与整合</div><div class="nav-item" data-page="week">周度执行跟进与纪要管理</div><div class="nav-item" data-page="todo">个人 To-Do List</div><div class="nav-item" data-page="report">报告生成中心</div></aside>
<main class="main"><div id="content"></div></main></div>
<script>
const pages={
goals:{title:'部门目标管理与月度拆解',sub:'部门总目标是专项清单与后续跟进的唯一依据',html:`<div class="top"><div><div class="title">部门目标管理与月度拆解</div><div class="sub">当前目标版本：2026年度部门目标 V1.0 · 最新更新 2026-08-18</div></div><button class="btn" onclick="alert('已进入目标文件上传流程（Demo）')">上传新版部门目标</button></div><div class="grid"><div class="card"><div class="muted">当前目标版本</div><div class="stat">V1.0</div></div><div class="card"><div class="muted">固定业务板块</div><div class="stat">3</div></div><div class="card"><div class="muted">当前专项</div><div class="stat">8</div></div></div><div class="section"><div class="section-title">三大业务板块</div><div class="board"><div class="card"><h3>赛尔课堂</h3><div class="project"><b>业务课程执行</b><br><span class="history">课程规划、执行与跟进</span></div><div class="project"><b>课程运营</b><br><span class="history">业务课程相关事项</span></div></div><div class="card"><h3>干部赋能</h3><div class="project"><b>干部赋能课程</b><br><span class="history">课程类专项</span></div><div class="project"><b>干部赋能专项</b><br><span class="history">专项项目执行</span></div><div class="project"><b>新人培养</b><br><span class="history">培养相关工作</span></div></div><div class="card"><h3>生态赋能</h3><div class="project"><b>生态圈项目</b><br><span class="history">生态相关项目</span></div><div class="project"><b>生态合作推进</b><br><span class="history">合作事项跟进</span></div></div></div></div><div class="section"><div class="section-title">月度目标拆解</div><table class="table"><tr><th>月份</th><th>板块</th><th>专项</th><th>目标</th><th>进度</th></tr><tr><td>8月</td><td><span class="tag">干部赋能</span></td><td>干部赋能专项</td><td>完成阶段性推进</td><td><div class="progress"><i></i></div></td></tr><tr><td>8月</td><td><span class="tag">生态赋能</span></td><td>生态圈项目</td><td>完成项目节点跟进</td><td><div class="progress"><i style="width:45%"></i></div></td></tr></table></div>`},
month:{title:'月度目标跟进与整合',sub:'承接月度拆解，整合组员月报并与周度记录去重',html:`<div class="top"><div><div class="title">月度目标跟进与整合</div><div class="sub">2026年8月 · 数据来源：月度目标、组员月报、周度跟进</div></div><button class="btn" onclick="alert('请选择组员月报截图（Demo）')">上传组员月报</button></div><div class="card"><div class="upload" onclick="alert('截图上传入口（Demo）')">点击上传组员月报截图<br><small>识别：本月完成情况、下月工作计划</small></div></div><div class="section"><div class="section-title">月度跟进整合结果</div><table class="table"><tr><th>板块</th><th>专项</th><th>本月完成情况</th><th>下月计划</th><th>处理</th></tr><tr><td>干部赋能</td><td>干部赋能专项</td><td>完成阶段任务，与周度记录重合2条</td><td>推进下一阶段任务</td><td><span class="tag">已合并去重</span></td></tr><tr><td>生态赋能</td><td>生态圈项目</td><td>新增项目推进内容</td><td>完成下阶段沟通</td><td><span class="tag">新增补录</span></td></tr></table></div>`},
week:{title:'周度执行跟进与纪要管理',sub:'将个人周报聚合为专项维度周会材料，并沉淀问题与支持事项',html:`<div class="top"><div><div class="title">周度执行跟进与纪要管理</div><div class="sub">第33周 · 2026-08-10 至 2026-08-16</div></div><button class="btn" onclick="alert('请选择组员周报截图（Demo）')">上传组员周报</button></div><div class="grid"><div class="card"><div class="muted">已聚合周报</div><div class="stat">6</div></div><div class="card"><div class="muted">专项跟进</div><div class="stat">8</div></div><div class="card"><div class="muted">待协调事项</div><div class="stat">3</div></div></div><div class="section"><div class="section-title">专项维度周会跟进</div><table class="table"><tr><th>板块</th><th>专项</th><th>本周进展</th><th>问题/发现</th><th>需要支持</th></tr><tr><td>赛尔课堂</td><td>业务课程执行</td><td>完成课程执行节点</td><td>部分资料待完善</td><td>协调资料支持</td></tr><tr><td>干部赋能</td><td>干部赋能专项</td><td>完成阶段推进</td><td>暂无</td><td>暂无</td></tr><tr><td>生态赋能</td><td>生态圈项目</td><td>推进项目沟通</td><td>合作节点需确认</td><td>协调确认</td></tr></table></div><div class="section"><button class="btn light">生成项目周会跟进纪要</button> <button class="btn light">生成周会跟进表格</button></div>`},
todo:{title:'个人 To-Do List',sub:'月日历视图 · 每日事项自动成为周报、月报数据源',html:`<div class="top"><div><div class="title">个人 To-Do List</div><div class="sub">2026年8月 · 今日事项可直接更新</div></div><button class="btn" onclick="alert('新增事项（Demo）')">+ 新增事项</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="day" style="min-height:34px"><b>周${x}</b></div>`).join('')}${Array.from({length:31},(_,i)=>`<div class="day"><b>${i+1}</b>${i%4===0?'<div class="todo">目标跟进</div>':''}${i%5===0?'<div class="todo">会议/沟通</div>':''}${i===17?'<div class="todo">整理周报</div>':''}</div>`).join('')}</div>`},
report:{title:'报告生成中心',sub:'从个人事项、周记录、月度跟进自动汇总周报/月报',html:`<div class="top"><div><div class="title">报告生成中心</div><div class="sub">所有报告内容均可追溯到原始工作记录</div></div></div><div class="grid"><div class="card"><div class="muted">本周个人事项</div><div class="stat">18</div><div class="muted">已完成 15 项</div></div><div class="card"><div class="muted">本月周报</div><div class="stat">3</div><div class="muted">已完成 3 周更新</div></div><div class="card"><div class="muted">月度跟进</div><div class="stat">8</div><div class="muted">专项均有记录</div></div></div><div class="section"><div class="section-title">报告生成</div><div class="grid"><div class="card"><h3>周报</h3><p class="muted">聚合本周个人每日事项，下周计划同步进入待办。</p><button class="btn" onclick="alert('周报已生成（Demo）')">生成本周周报</button></div><div class="card"><h3>月报</h3><p class="muted">聚合周报、月度目标跟进、组员月报整合内容。</p><button class="btn" onclick="alert('月报已生成（Demo）')">生成本月月报</button></div><div class="card"><h3>内容溯源</h3><p class="muted">每块报告内容均可查看原始待办、周记录、月度记录。</p><button class="btn light" onclick="alert('打开溯源（Demo）')">查看溯源</button></div></div></div>`}}
function render(page){document.getElementById('content').innerHTML=pages[page].html;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}
document.querySelectorAll('.nav-item').forEach(x=>x.onclick=()=>render(x.dataset.page));render('goals');
</script></body></html>
